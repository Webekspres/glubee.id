# Build image aplikasi, push ke GHCR, lalu deploy ke VPS Webekspres (ADR-0001).
# Otomatis: push ke dev (selama GO_LIVE bukan "true") atau push ke main (setelah GO_LIVE = "true").
# Manual: tab Actions -> "Deploy" -> pilih branch -> Run workflow.
#
# Secrets (environment "production", hanya branch dev + main):
#           VPS_HOST, VPS_PORT, VPS_USER (adminweb), VPS_SSH_KEY (key khusus Actions), VPS_KNOWN_HOSTS,
#           NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# Repo publik: log Actions bisa dilihat siapa pun, jadi output langkah SSH dibuat minimal.
# Variable: GO_LIVE = "true" setelah ada pengguna aktif -> deploy hanya boleh dari main.
# Push di jam puncak tidak gagal: job menunggu sampai jam puncak selesai. Run manual tetap ditolak.

name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/webekspres/glubee

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.branch.outputs.run }}
    steps:
      - name: Cek branch terhadap GO_LIVE
        id: branch
        run: |
          if [ "${{ vars.GO_LIVE }}" = true ] && [ "${{ github.ref_name }}" != main ]; then
            if [ "${{ github.event_name }}" = push ]; then
              echo "Sudah go-live, push ke ${{ github.ref_name }} tidak di-deploy."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Setelah go-live, deploy hanya dari main (sekarang: ${{ github.ref_name }})."
            exit 1
          fi
          if [ "${{ vars.GO_LIVE }}" != true ] && [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" != dev ]; then
            echo "Belum go-live, push ke ${{ github.ref_name }} tidak di-deploy otomatis (hanya dev)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Tolak jam puncak app lain di VPS (WIB)
        if: steps.branch.outputs.run == 'true'
        run: |
          peak() {
            now=$(TZ=Asia/Jakarta date +%H%M)
            { [ "$now" -ge 0600 ] && [ "$now" -lt 0730 ]; } || { [ "$now" -ge 1245 ] && [ "$now" -lt 1445 ]; }
          }
          if [ "${{ github.event_name }}" = push ]; then
            while peak; do echo "Jam puncak (WIB), menunggu..."; sleep 60; done
          elif peak; then
            echo "::error::Sekarang $now WIB, di dalam jam puncak (06:00-07:30, 12:45-14:45). Deploy dibatalkan."
            exit 1
          fi

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Production build dijalankan di dalam docker build, jadi tidak diulang di sini.
      - run: bun run lint && bun run typecheck && bun test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Dicek ulang karena build bisa berjalan beberapa menit setelah job guard.
      - name: Tolak jam puncak app lain di VPS (WIB)
        run: |
          peak() {
            now=$(TZ=Asia/Jakarta date +%H%M)
            { [ "$now" -ge 0600 ] && [ "$now" -lt 0730 ]; } || { [ "$now" -ge 1245 ] && [ "$now" -lt 1445 ]; }
          }
          if [ "${{ github.event_name }}" = push ]; then
            while peak; do echo "Jam puncak (WIB), menunggu..."; sleep 60; done
          elif peak; then
            echo "::error::Sekarang $now WIB, di dalam jam puncak (06:00-07:30, 12:45-14:45). Image sudah di GHCR; jalankan ulang setelah jam puncak."
            exit 1
          fi
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull dan restart app
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/glubee
          # Tag disimpan di .env agar `docker compose up` manual berikutnya tidak kembali ke tag lama.
          sed -i "s/^APP_TAG=.*/APP_TAG=${{ github.sha }}/" .env
          docker compose pull --quiet app
          docker compose up -d --quiet-pull app 2>&1 | tail -n 1
          EOF
      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null https://glubee.id/ && break
            sleep 3
          done
          curl -fsS -o /dev/null https://glubee.id/
          curl -fsS -o /dev/null https://api.glubee.id/auth/v1/health
