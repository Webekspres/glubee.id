# /etc/nginx/sites-available/glubee.id -> symlink ke sites-enabled.
# Dipasang oleh deploy/nginx/install.sh (sertifikat webroot `glubee.id` mencakup glubee.id + api.glubee.id).
# Port upstream harus sama dengan APP_HOST_PORT di /opt/glubee/.env.

# Rate limit per IP pengguna asli untuk endpoint auth aplikasi (SRS §11, ADR-0001).
# GoTrue hanya melihat IP container app, jadi pembatasan per pengguna dilakukan di sini.
limit_req_zone $binary_remote_addr zone=glubee_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name glubee.id;

    # ACME webroot: dipakai certbot host (timer) dan container certbot_ssl (/opt/certbot-global).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glubee.id;

    ssl_certificate /etc/letsencrypt/live/glubee.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glubee.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=glubee_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
