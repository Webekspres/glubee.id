# /etc/nginx/sites-available/glubee.id -> symlink ke sites-enabled.
# Tulis versi HTTP ini dulu, lalu `certbot --nginx -d glubee.id -d api.glubee.id` menambahkan blok 443 + redirect.
# Port upstream harus sama dengan APP_HOST_PORT di /opt/glubee/.env.

# Rate limit per IP pengguna asli untuk endpoint auth aplikasi (SRS §11, ADR-0001).
# GoTrue hanya melihat IP container app, jadi pembatasan per pengguna dilakukan di sini.
limit_req_zone $binary_remote_addr zone=glubee_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name glubee.id;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=glubee_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
