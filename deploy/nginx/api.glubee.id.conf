# /etc/nginx/sites-available/api.glubee.id -> symlink ke sites-enabled.
# Pengganti gateway Kong/Envoy (ADR-0001): nginx merutekan path Supabase langsung ke GoTrue dan PostgREST.
# Port upstream harus sama dengan AUTH_HOST_PORT (9999) dan REST_HOST_PORT (3001) di /opt/glubee/.env.
#
# Publik  : hanya path yang dibuka browser atau link email.
# Internal: path lain hanya untuk container app (subnet GLUBEE_SUBNET) yang masuk lewat extra_hosts.
# Menambah fitur yang memanggil Supabase dari browser (realtime, OAuth provider lain, magic link)
# berarti path-nya harus ditambahkan ke blok publik di bawah.

# Berbasis $remote_addr (IP koneksi langsung), bukan X-Forwarded-For, sehingga tidak bisa dipalsukan.
geo $glubee_internal {
    default          0;
    127.0.0.1        1;
    172.30.10.0/24   1;  # GLUBEE_SUBNET
}

limit_req_zone $binary_remote_addr zone=glubee_api_public:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.glubee.id;

    # ACME webroot: dipakai certbot host (timer) dan container certbot_ssl (/opt/certbot-global).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.glubee.id;

    ssl_certificate /etc/letsencrypt/live/glubee.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glubee.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Selalu ditimpa: GoTrue memakai header ini untuk rate limit (GOTRUE_RATE_LIMIT_HEADER).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Publik ----
    location = /auth/v1/health {
        proxy_pass http://127.0.0.1:9999/health;
    }
    # Link verifikasi/pemulihan di email.
    location = /auth/v1/verify {
        limit_req zone=glubee_api_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:9999/verify;
    }
    # Login Google: redirect awal dan callback dari Google.
    location = /auth/v1/authorize {
        limit_req zone=glubee_api_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:9999/authorize;
    }
    location = /auth/v1/callback {
        limit_req zone=glubee_api_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:9999/callback;
    }

    # ---- Internal (container app) ----
    location /auth/v1/ {
        if ($glubee_internal = 0) { return 403; }
        proxy_pass http://127.0.0.1:9999/;
    }
    location /rest/v1/ {
        if ($glubee_internal = 0) { return 403; }
        proxy_pass http://127.0.0.1:3001/;
    }

    location / {
        return 404;
    }
}
